<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELLA CO. — Luxury Clothing</title>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#111;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

.header{
    height:92px;
    width:100%;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 42px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-family:Georgia,serif;
    font-size:43px;
    letter-spacing:8px;
    white-space:nowrap;
    color:#111;
}

.logo span{
    color:#b99a72;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:28px;
}

.icon-btn{
    width:52px;
    height:52px;
    border:0;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.icon-btn svg{
    width:31px;
    height:31px;
    stroke:#111;
    fill:none;
    stroke-width:1.8;
}

.icon-btn:hover svg{
    stroke:#b99a72;
}

.cart-count{
    position:absolute;
    top:0;
    right:-2px;
    min-width:25px;
    height:25px;
    padding:0 6px;
    border-radius:50%;
    background:#b99a72;
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= MENU ================= */

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:1998;
    display:none;
}

.menu-overlay.active{
    display:block;
}

.side-menu{
    position:fixed;
    top:0;
    right:-390px;
    width:370px;
    max-width:90%;
    height:100vh;
    background:#fff;
    z-index:1999;
    transition:.35s ease;
    padding:35px;
    box-shadow:-8px 0 30px rgba(0,0,0,.12);
}

.side-menu.active{
    right:0;
}

.menu-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding-bottom:25px;
}

.menu-title{
    font-family:Georgia,serif;
    font-size:30px;
}

.close-menu{
    border:0;
    background:none;
    font-size:34px;
}

.menu-links{
    margin-top:35px;
}

.menu-links button{
    width:100%;
    border:0;
    border-bottom:1px solid #eee;
    background:none;
    text-align:left;
    padding:18px 0;
    font-size:17px;
    letter-spacing:2px;
}

.menu-social{
    margin-top:50px;
}

.menu-social h4{
    font-size:13px;
    letter-spacing:2px;
    color:#777;
    margin-bottom:20px;
}

.social-row{
    display:flex;
    gap:12px;
}

.social-icon{
    width:48px;
    height:48px;
    border:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.social-icon svg{
    width:23px;
    height:23px;
    stroke:#111;
    fill:none;
    stroke-width:1.8;
}

/* ================= HERO ================= */

.hero{
    min-height:620px;
    background:#faf9f7;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 25px;
}

.hero-content{
    max-width:850px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:72px;
    font-weight:400;
    letter-spacing:3px;
}

.hero p{
    margin:28px auto 38px;
    color:#777;
    font-size:23px;
    line-height:1.6;
    max-width:700px;
}

.black-btn{
    background:#111;
    color:#fff;
    border:1px solid #111;
    padding:20px 52px;
    font-size:14px;
    letter-spacing:4px;
}

.black-btn:hover{
    background:#b99a72;
    border-color:#b99a72;
}

/* ================= SECTION ================= */

.section{
    padding:100px 35px;
}

.section-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:55px;
    font-weight:400;
    margin-bottom:65px;
}

/* ================= PRODUCTS ================= */

.products{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:35px;
}

.product-card{
    background:#faf9f7;
    position:relative;
    overflow:hidden;
}

.product-img{
    width:100%;
    aspect-ratio:4/5;
    background:#eee;
    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.5s;
}

.product-card:hover .product-img img{
    transform:scale(1.04);
}

.discount{
    position:absolute;
    top:20px;
    left:20px;
    background:#c44232;
    color:#fff;
    padding:10px 15px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
}

.wish-product{
    position:absolute;
    top:17px;
    right:17px;
    width:42px;
    height:42px;
    border:0;
    background:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.wish-product svg{
    width:21px;
    height:21px;
    stroke:#111;
    fill:none;
}

.wish-product.active svg{
    fill:#b99a72;
    stroke:#b99a72;
}

.product-info{
    padding:28px 20px 25px;
    text-align:center;
}

.product-name{
    font-family:Georgia,serif;
    font-size:27px;
    margin-bottom:12px;
}

.product-desc{
    color:#777;
    line-height:1.5;
    font-size:15px;
    min-height:46px;
}

.price-row{
    margin:20px 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.old-price{
    color:#999;
    text-decoration:line-through;
    font-size:18px;
}

.new-price{
    font-size:25px;
    font-weight:bold;
}

.off{
    color:#c44232;
    font-weight:bold;
}

.product-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.outline-btn,
.product-order-btn{
    width:100%;
    height:58px;
    letter-spacing:3px;
    font-size:13px;
}

.outline-btn{
    background:#fff;
    border:1px solid #111;
}

.product-order-btn{
    background:#111;
    color:#fff;
    border:1px solid #111;
}

.outline-btn:hover{
    background:#111;
    color:#fff;
}

/* ================= FOOTER ================= */

.footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:85px 20px 45px;
}

.footer-logo{
    font-family:Georgia,serif;
    font-size:46px;
    letter-spacing:5px;
}

.footer-logo span{
    color:#b99a72;
}

.footer-sub{
    margin:22px 0 40px;
    color:#aaa;
    letter-spacing:3px;
}

.footer .social-row{
    justify-content:center;
}

.footer .social-icon{
    border-color:#444;
}

.footer .social-icon svg{
    stroke:#fff;
}

.copyright{
    margin-top:55px;
    color:#777;
    font-size:14px;
}

/* ================= CART ================= */

.cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:3000;
    display:none;
}

.cart-overlay.active{
    display:block;
}

.cart-panel{
    position:fixed;
    right:-520px;
    top:0;
    width:500px;
    max-width:92%;
    height:100vh;
    background:#fff;
    z-index:3001;
    transition:.35s ease;
    display:flex;
    flex-direction:column;
}

.cart-panel.active{
    right:0;
}

.cart-header{
    padding:35px 32px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-header h2{
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:400;
}

.close-cart{
    border:0;
    background:none;
    font-size:30px;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.cart-item{
    display:flex;
    gap:20px;
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:105px;
    height:125px;
    object-fit:cover;
    background:#eee;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-family:Georgia,serif;
    font-size:20px;
    margin-bottom:8px;
}

.cart-item-price{
    color:#b18f65;
    font-weight:bold;
    margin-bottom:15px;
}

.qty{
    display:flex;
    align-items:center;
    gap:15px;
}

.qty button{
    width:34px;
    height:34px;
    border:1px solid #ddd;
    background:#fff;
    font-size:18px;
}

.delete-item{
    border:0;
    background:none;
    color:#999;
    font-size:20px;
}

.cart-bottom{
    border-top:1px solid #eee;
    padding:25px 30px 30px;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:22px;
    margin-bottom:25px;
}

.checkout-btn{
    width:100%;
    height:58px;
    border:0;
    background:#111;
    color:#fff;
    letter-spacing:4px;
}

.empty-cart{
    text-align:center;
    color:#777;
    padding-top:60px;
}

/* ================= SEARCH ================= */

.search-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.98);
    z-index:4000;
    display:none;
    padding:35px;
}

.search-overlay.active{
    display:block;
}

.search-top{
    display:flex;
    align-items:center;
    gap:20px;
    max-width:1000px;
    margin:auto;
}

.search-input{
    flex:1;
    border:0;
    border-bottom:1px solid #111;
    padding:18px 5px;
    font-size:25px;
    outline:none;
}

.close-search{
    border:0;
    background:none;
    font-size:35px;
}

.search-results{
    max-width:1000px;
    margin:50px auto;
}

.search-result{
    padding:18px 0;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
}

/* ================= CHECKOUT ================= */

.checkout-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.52);
    z-index:5000;
    display:none;
    overflow-y:auto;
    padding:55px 20px;
}

.checkout-overlay.active{
    display:block;
}

.checkout-box{
    width:620px;
    max-width:100%;
    background:#fff;
    margin:auto;
    padding:65px 62px;
}

.checkout-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:43px;
    font-weight:400;
}

.checkout-sub{
    text-align:center;
    color:#888;
    font-size:20px;
    margin:14px 0 55px;
}

.form-group{
    margin-bottom:28px;
}

.form-group label{
    display:block;
    color:#666;
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    padding:18px 20px;
    font-size:17px;
    outline:none;
}

.form-group textarea{
    min-height:105px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#111;
}

.discount-row{
    display:flex;
    gap:15px;
}

.discount-row input{
    flex:1;
}

.apply-btn{
    width:125px;
    border:0;
    background:#111;
    color:#fff;
    font-size:13px;
    letter-spacing:2px;
}

.discount-message{
    margin-top:10px;
    font-size:14px;
}

.summary{
    background:#faf9f7;
    padding:25px;
    margin:40px 0;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    font-size:17px;
}

.summary-row.total{
    border-top:1px solid #ddd;
    margin-top:10px;
    padding-top:20px;
    font-weight:bold;
    font-size:24px;
}

.checkout-actions{
    display:grid;
    grid-template-columns:1fr 1.5fr;
    gap:20px;
}

.cancel-btn,
.place-order-btn{
    height:60px;
    font-size:14px;
    letter-spacing:3px;
}

.cancel-btn{
    background:#fff;
    border:1px solid #ddd;
}

.place-order-btn{
    background:#111;
    border:1px solid #111;
    color:#fff;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#111;
    color:#fff;
    padding:15px 25px;
    z-index:8000;
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .header{
        height:82px;
        padding:0 18px;
    }

    .logo{
        font-size:31px;
        letter-spacing:5px;
    }

    .header-actions{
        gap:3px;
    }

    .icon-btn{
        width:43px;
        height:43px;
    }

    .icon-btn svg{
        width:27px;
        height:27px;
    }

    .hero{
        min-height:550px;
        padding:60px 25px;
    }

    .hero h1{
        font-size:47px;
    }

    .hero p{
        font-size:18px;
    }

    .section{
        padding:70px 18px;
    }

    .section-title{
        font-size:42px;
        margin-bottom:40px;
    }

    .products{
        grid-template-columns:1fr;
        gap:25px;
    }

    .product-name{
        font-size:25px;
    }

    .cart-panel{
        width:100%;
        max-width:100%;
    }

    .checkout-overlay{
        padding:0;
    }

    .checkout-box{
        min-height:100vh;
        padding:45px 32px 40px;
    }

    .checkout-title{
        font-size:38px;
    }

    .checkout-actions{
        grid-template-columns:1fr 1.4fr;
    }

    .side-menu{
        width:350px;
    }
}

@media(max-width:420px){

    .logo{
        font-size:27px;
        letter-spacing:3px;
    }

    .header-actions{
        gap:0;
    }

    .icon-btn{
        width:39px;
    }

    .hero h1{
        font-size:40px;
    }

    .checkout-box{
        padding:40px 24px;
    }

    .discount-row{
        gap:8px;
    }

    .apply-btn{
        width:95px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        VELLA <span>CO.</span>
    </div>

    <div class="header-actions">

        <!-- SEARCH -->
        <button class="icon-btn" onclick="openSearch()" aria-label="Search">
            <svg viewBox="0 0 24 24">
                <circle cx="10.8" cy="10.8" r="6.8"></circle>
                <path d="M16 16l5 5"></path>
            </svg>
        </button>

        <!-- WISHLIST -->
        <button class="icon-btn" onclick="openWishlist()" aria-label="Wishlist">
            <svg viewBox="0 0 24 24">
                <path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.6z"></path>
            </svg>
        </button>

        <!-- CART -->
        <button class="icon-btn" onclick="openCart()" aria-label="Cart">

                <circle cx="9" cy="20" r="1"></circle>
                <circle cx="18" cy="20" r="1"></circle>

        <!-- MENU -->
        <button class="icon-btn" onclick="openMenu()" aria-label="Menu">

                <path d="M3 6h18"></path>
                <path d="M3 12h18"></path>
                <path d="M3 18h18"></path>

    </div>
</header>


<!-- ================= MENU ================= -->

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

<aside class="side-menu" id="sideMenu">

    <div class="menu-top">
        <div class="menu-title">VELLA CO.</div>

        <button class="close-menu" onclick="closeMenu()">×</button>
    </div>

    <div class="menu-links">

                <svg viewBox="0 0 24 24">
                    <path d="M5 4l14 16"></path>
                    <path d="M19 4L5 20"></path>
                </svg>

            </a>

        </div>
    </div>

</aside>


<!-- ================= HERO ================= -->

<section class="hero" id="home">

    <div class="hero-content">

        <h1>VELLA CO.</h1>

        <p>

        <button class="black-btn" onclick="goCollection()">

</section>


<!-- ================= COLLECTION ================= -->

    <div class="products" id="productsContainer"></div>

</section>


<!-- ================= FOOTER ================= -->

        </a>

        <a class="social-icon"

                <path d="M8.5 8.5c.3-.4.6-.4.9-.1l1 1c.2.2.2.5 0 .8l-.4.5c.7 1.2 1.4 1.9 2.6 2.6l.5-.4c.3-.2.6-.2.8 0l1 1c.3.3.3.6-.1.9-.5.5-1.2.7-1.8.5-2.4-.8-4.4-2.8-5.2-5.2-.2-.6 0-1.3.5-1.8z"></path>
            </svg>

        </a>

        <a class="social-icon"

            <svg viewBox="0 0 24 24">

        </a>

    </div>

    <div class="copyright">
        © 2026 VELLA CO. All rights reserved.
    </div>

</footer>


<!-- ================= CART ================= -->

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<aside class="cart-panel" id="cartPanel">

    <div class="cart-header">

        <h2>Your Cart</h2>

        <button class="close-cart" onclick="closeCart()">×</button>

    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-bottom">

        <div class="cart-total">
            <span>Total</span>
            <strong id="cartTotal">₹0</strong>
        </div>

        <button class="checkout-btn" onclick="openCheckout()">
            CHECKOUT
        </button>

    </div>

</aside>


<!-- ================= SEARCH ================= -->

<div class="search-overlay" id="searchOverlay">

    <div class="search-top">

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search products..."
            oninput="searchProducts()"
        >

        <button class="close-search" onclick="closeSearch()">
            ×
        </button>

    </div>

    <div class="search-results" id="searchResults"></div>

</div>

<!-- ================= CHECKOUT ================= -->

<div class="checkout-overlay" id="checkoutOverlay">

    <div class="checkout-box">

        <h2 class="checkout-title">
            Checkout
        </h2>

        <p class="checkout-sub">
            Complete your order
        </p>

        <div class="form-group">

            <label>
                FULL NAME *
            </label>

            <input
                id="customerName"
                type="text"
                placeholder="Your full name"
            >

        </div>


        <div class="form-group">

            <label>
                PHONE *
            </label>

            <input
                id="customerPhone"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                placeholder="10-digit mobile number"
            >

        </div>


        <div class="form-group">

            <label>
                EMAIL
            </label>

            <input
                id="customerEmail"
                type="email"
                placeholder="your@email.com"
            >

        </div>


        <div class="form-group">

            <label>
                DELIVERY ADDRESS *
            </label>

            <textarea
                id="customerAddress"
                placeholder="House no, Street, City, Pincode"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                DISCOUNT CODE
            </label>

            <div class="discount-row">

                <input
                    id="discountCode"
                    type="text"
                    placeholder="e.g. VELLA10"
                >

                <button
                    class="apply-btn"
                    onclick="applyDiscount()"
                >
                    APPLY
                </button>

            </div>

            <div
                class="discount-message"
                id="discountMessage">
            </div>

        </div>


        <div class="summary">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">₹0</strong>
            </div>

            <div
                class="summary-row"
                id="discountRow"
                style="display:none;"
            >
                <span>Discount</span>
                <strong id="discountAmount">
                    -₹0
                </strong>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <strong id="checkoutTotal">₹0</strong>
            </div>

        </div>


        <div class="checkout-actions">

            <button
                class="cancel-btn"
                onclick="closeCheckout()"
            >
                CANCEL
            </button>

            <button
                class="place-order-btn"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>

        </div>

    </div>

</div>
<!-- ================= TOAST ================= -->

<div class="toast" id="toast"></div>
